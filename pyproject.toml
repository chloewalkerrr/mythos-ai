[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]

ignore = [
    "B008"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "venv/*",
    "tests/*",
    "scripts/*",
]